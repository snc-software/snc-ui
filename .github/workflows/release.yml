name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@snc-software'

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build

      - name: Determine semver bump from merged PR
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number')
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            echo "::error::No merged pull request found for commit ${{ github.sha }}; cannot determine version bump."
            exit 1
          fi
          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -E '^semver:(major|minor|patch)$' || true)
          COUNT=$(echo "$LABELS" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Merged PR #$PR_NUMBER must have exactly one semver:major, semver:minor, or semver:patch label (found $COUNT)."
            exit 1
          fi
          echo "bump=${LABELS#semver:}" >> "$GITHUB_OUTPUT"

      - name: Compute release version
        id: version
        run: |
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          BASE_VERSION=${LATEST_TAG#v}
          BASE_VERSION=${BASE_VERSION:-0.0.0}
          npm pkg set version="$BASE_VERSION"
          npm version "${{ steps.label.outputs.bump }}" --no-git-tag-version
          NEXT_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Tag release and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
